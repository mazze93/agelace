name: Release

# A tag v0.2.0 or v0.2.0-beta.1 publishes the multi-arch image to GHCR with SBOM
# and provenance, signs it keylessly with cosign, builds the friend's zip (whose
# compose.yaml pulls exactly this version), and attaches it to a GitHub Release.
# A tag with a hyphen is a pre-release and also moves :beta; otherwise :latest.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag
        id: v
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          case "$ver" in *-*) pre=true; channel=beta ;; *) pre=false; channel=latest ;; esac
          grep -q "\"version\": \"$ver\"" package.json || { echo "::error::package.json version is not $ver"; exit 1; }
          { echo "tag=$tag"; echo "ver=$ver"; echo "pre=$pre"; echo "channel=$channel"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64, SBOM + provenance)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.ver }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.channel }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.ver }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify the signature
        run: |
          cosign verify "${IMAGE}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "signature verified"

      - name: Friend's bundle
        run: scripts/release-bundle.sh "${{ steps.v.outputs.ver }}"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes="docs/release/notes-${{ steps.v.outputs.ver }}.md"
          test -f "$notes" || { echo "::error::write $notes first"; exit 1; }
          {
            cat "$notes"
            echo
            echo "**Image** \`${IMAGE}:${{ steps.v.outputs.ver }}\`"
            echo "digest \`${{ steps.build.outputs.digest }}\` (amd64 + arm64, SBOM, provenance, cosign keyless)"
          } > /tmp/notes.md
          flags=""
          [ "${{ steps.v.outputs.pre }}" = true ] && flags="--prerelease"
          gh release create "${{ steps.v.outputs.tag }}" $flags \
            --repo "${{ github.repository }}" \
            --title "agelace ${{ steps.v.outputs.ver }}" \
            --notes-file /tmp/notes.md \
            "dist/agelace-${{ steps.v.outputs.ver }}.zip"
